name: Deploy to Production

# Auto-deploys on merge to main; workflow_dispatch kept for manual re-runs.
on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  # Runs xUnit tests — all downstream jobs declare needs: [test] transitively, so a failure here stops the pipeline
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: "10.0.x"

      - name: Run tests
        run: dotnet test --verbosity normal

  # Applies EF Core migrations directly to Render Postgres before the backend is released.
  # needs: [test]; a failed migration blocks release-backend, so the live service keeps the old schema.
  migrate:
    runs-on: ubuntu-latest
    needs: [test]
    steps:
      - uses: actions/checkout@v6

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: "10.0.x"

      # dotnet-ef is not on the runner by default — install as a global tool.
      # $GITHUB_PATH persists the tools directory into PATH for all subsequent steps.
      - name: Install dotnet-ef
        run: |
          dotnet tool install --global dotnet-ef
          echo "$HOME/.dotnet/tools" >> $GITHUB_PATH

      - name: Restore NuGet packages
        run: dotnet restore

      # Render Postgres is internet-reachable, so connect straight over its external URL, no tunnel.
      # SNI requires the hostname (not an IP); Trust Server Certificate because Render's CA
      # is not in the runner trust store. ConnectionStrings__ maps to ConnectionStrings: in config.
      - name: Run migrations
        env:
          ConnectionStrings__JobTrackerContext: "${{ secrets.RENDER_DATABASE_URL }};SSL Mode=Require;Trust Server Certificate=true"
        run: dotnet ef database update --project backend

  # Triggers the Render backend deploy via its deploy hook.
  # needs: [migrate]; a failed migration blocks the release, so the schema is always ahead of the code.
  release-backend:
    runs-on: ubuntu-latest
    needs: [migrate]
    steps:
      - name: Trigger Render deploy
        run: curl --fail --silent --show-error "${{ secrets.RENDER_DEPLOY_HOOK_URL }}"
