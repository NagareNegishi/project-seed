name: Flatpak build

# Runs the actual flatpak-builder build pass against flatpak/com.nagarenegishi.jobtracker.yml
# (impl.md Step 12, item 2). Manual for now (workflow_dispatch) — the manifest, and the
# runtime-version pairing / sidecar-suffix questions flagged in its header, aren't confirmed
# working yet. This can't run in the devcontainer: flatpak-builder needs bubblewrap, which
# needs unprivileged user namespaces, and the devcontainer doesn't have them.
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - uses: actions/checkout@v4

      - name: Install flatpak + flatpak-builder
        timeout-minutes: 5
        run: |
          for i in 1 2 3; do
            timeout 60 sudo apt-get update && break
            echo "apt-get update stalled/failed (attempt $i), retrying..."
            sleep 10
          done
          sudo apt-get install -y flatpak flatpak-builder

      - name: Add Flathub remote
        run: flatpak remote-add --if-not-exists --user flathub https://flathub.org/repo/flathub.flatpakrepo

      # install-deps-from resolves the runtime/SDK/SDK-extension versions from the manifest
      # itself rather than us pre-guessing branches — including the still-unconfirmed
      # org.gnome.Platform//47 vs. freedesktop-sdk 25.08 pairing (see the manifest header).
      - name: flatpak-builder
        run: |
          flatpak-builder --user --install-deps-from=flathub --force-clean \
            --repo=repo builddir flatpak/com.nagarenegishi.jobtracker.yml

      - name: Upload build logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: flatpak-build-logs
          path: .flatpak-builder/**/*.log
          if-no-files-found: ignore
          retention-days: 1

      - name: Bundle single-file .flatpak
        if: success()
        run: flatpak build-bundle repo com.nagarenegishi.jobtracker.flatpak com.nagarenegishi.jobtracker

      - name: Upload .flatpak bundle
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: flatpak-bundle
          path: com.nagarenegishi.jobtracker.flatpak
          if-no-files-found: error
          retention-days: 3
