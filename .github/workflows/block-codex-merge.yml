name: Block codex-setup merge

# Required status check for the "Block-codex" branch ruleset on main.
# Fails on purpose when a PR's source branch is codex-setup; passes for
# everything else. See AGENTS.md / CLAUDE.md branching notes for why.

on:
  pull_request:
    branches: [main]

jobs:
  block-codex-setup:
    runs-on: ubuntu-latest
    steps:
      - name: Reject if source branch is codex-setup
        run: |
          if [ "${{ github.head_ref }}" = "codex-setup" ]; then
            echo "codex-setup must never merge into main." >&2
            exit 1
          fi
